name: Windows + JDK21 + JavaFX jlink (Auto Zip)

# 触发方式：推送(push)到main分支时自动运行
on:
  push:
    branches: [ main ]
  # 保留手动触发（方便调试）
  workflow_dispatch:

jobs:
  javafx-jlink-build:
    runs-on: windows-latest
    steps:
      # 步骤1：检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：配置JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 步骤3：验证基础环境
      - name: Verify Env (JDK/Maven)
        run: |
          java -version
          mvn -v

      # 步骤4：执行Maven package（临时添加-e -X便于调试编译错误）
      - name: Maven Clean Package
        run: |
          # 临时添加-X（调试日志）、-e（完整堆栈），方便定位编译问题
          # 若想强制跳过编译错误（仅调试），可加 -Dmaven.compiler.failOnError=false
          mvn clean package -DskipTests=true -e -X
        continue-on-error: false # 编译失败则终止（必须修复代码）

      # 步骤5：执行JavaFX jlink（自动生成image目录 + app.zip）
      - name: Run JavaFX jlink (Auto Zip)
        run: |
          mvn javafx:jlink -DskipTests=true
          # 验证自动生成的zip文件
          Get-ChildItem -Path "target/*.zip"
          Write-Host "JLink auto-generated zip: $(Get-Item target/*.zip | Select-Object -ExpandProperty Name)"

      # 步骤6：上传插件自动生成的app.zip
      - name: Upload Auto-Generated app.zip
        uses: actions/upload-artifact@v4
        with:
          name: javafx-jlink-app.zip
          path: target/*.zip
          retention-days: 30