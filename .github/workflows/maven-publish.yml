name: 构建+BAT转EXE+压缩上传

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # 步骤1：检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 步骤2：配置JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'

      # 步骤3：执行mvn package
      - name: Run mvn package
        id: run-package
        shell: pwsh
        run: |
          $env:MAVEN_OPTS = "-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8"
          echo "MAVEN_OPTS=$env:MAVEN_OPTS" >> $env:GITHUB_ENV
          
          Write-Host "📦 执行 mvn clean package -DskipTests=true"
          mvn clean package -DskipTests=true
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ mvn package 失败！"
            exit 1
          }
          Write-Host "✅ mvn package 成功"

      # 步骤4：执行javafx:jlink
      - name: Run javafx:jlink
        id: run-jlink
        shell: pwsh
        run: |
          Write-Host "🔗 执行 mvn javafx:jlink -DskipTests=true"
          mvn javafx:jlink -DskipTests=true
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ javafx:jlink 失败！"
            exit 1
          }
          Write-Host "✅ javafx:jlink 成功"

      # 步骤5：下载便携版BAT to EXE Converter（解决Chocolatey下架问题）
      - name: Download BAT to EXE Converter (Portable)
        id: download-bat2exe
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $toolDir = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "tools/bat2exe"
          $zipFile = Join-Path -Path $toolDir -ChildPath "bat2exe-converter.zip"
          $bat2exeUrls = @(
            "https://mirror.ghproxy.com/https://downloads.sourceforge.net/project/bat-to-exe-converter/bat2exe-converter.zip",
            "https://downloads.sourceforge.net/project/bat-to-exe-converter/bat2exe-converter.zip"
          )

          # 创建工具目录
          if (-not (Test-Path $toolDir)) { New-Item -Path $toolDir -ItemType Directory -Force | Out-Null }

          # 循环下载
          $downloadSuccess = $false
          foreach ($url in $bat2exeUrls) {
            try {
              Write-Host "📥 尝试下载：$url"
              curl -L -o "$zipFile" "$url" --connect-timeout 30 --max-time 300
              if (Test-Path $zipFile -and (Get-Item $zipFile).Length -gt 0) {
                $downloadSuccess = $true
                break
              }
            } catch { Write-Warning "⚠️ 下载失败：$_" }
          }

          if (-not $downloadSuccess) {
            Write-Error "❌ BAT to EXE Converter 下载失败！"
            exit 1
          }

          # 解压并查找bat2exe.exe
          Expand-Archive -Path $zipFile -DestinationPath $toolDir -Force
          $bat2exeExe = Get-ChildItem -Path $toolDir -Recurse -Name "bat2exe.exe" | Select-Object -First 1
          if ([string]::IsNullOrEmpty($bat2exeExe)) {
            Write-Error "❌ 未找到bat2exe.exe！"
            exit 1
          }

          $bat2exePath = Join-Path -Path $toolDir -ChildPath $bat2exeExe
          echo "BAT2EXE_PATH=$bat2exePath" >> $env:GITHUB_ENV
          Write-Host "✅ BAT to EXE Converter 准备完成：$bat2exePath"

      # 步骤6：将target/app/bin/app.bat转为SpigotPluginCreaterTool.exe
      - name: Convert app.bat to SpigotPluginCreaterTool.exe
        id: convert-bat
        shell: pwsh
        run: |
          # 定义路径
          $batPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/app/bin/app.bat"
          $exePath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/app/bin/SpigotPluginCreaterTool.exe"

          # 检查BAT文件是否存在
          if (-not (Test-Path $batPath)) {
            Write-Error "❌ 未找到 $batPath 文件！"
            exit 1
          }

          # 执行转换
          Write-Host "🔄 转换 BAT → EXE：$batPath → $exePath"
          & "$env:BAT2EXE_PATH" `
            --bat "$batPath" `
            --exe "$exePath" `
            --author "BXWBB" `
            --product "SpigotPluginCreaterTool" `
            --description "Spigot插件开发工具" `
            --noconsole `
            --unicode `
            --admin 0 `
            --icon none

          # 验证转换结果
          if (Test-Path $exePath) {
            Write-Host "✅ EXE生成成功：$exePath"
            Get-Item $exePath | Format-List Name, Length, FullName
          } else {
            Write-Error "❌ EXE生成失败！"
            exit 1
          }

      # 步骤7：删除target/app.zip（按之前要求）
      - name: Delete app.zip
        shell: pwsh
        run: |
          $appZipPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/app.zip"
          if (Test-Path $appZipPath) {
            Write-Host "🗑️ 删除 $appZipPath"
            Remove-Item -Path $appZipPath -Force
            Write-Host "✅ 删除成功"
          } else {
            Write-Host "ℹ️ 未找到app.zip，无需删除"
          }

      # 步骤8：压缩target/app目录为SpigotPluginCreaterTool.zip（存到target目录）
      - name: Compress target/app to SpigotPluginCreaterTool.zip
        id: compress-app
        shell: pwsh
        run: |
          # 定义路径
          $appDir = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/app"
          $zipPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/SpigotPluginCreaterTool.zip"

          # 检查app目录是否存在
          if (-not (Test-Path $appDir)) {
            Write-Error "❌ 未找到 $appDir 目录！"
            exit 1
          }

          # 压缩目录（覆盖已有文件）
          Write-Host "📦 压缩 $appDir → $zipPath"
          Compress-Archive -Path "$appDir/*" -DestinationPath $zipPath -Force

          # 验证压缩包
          if (Test-Path $zipPath) {
            Write-Host "✅ 压缩包生成成功：$zipPath"
            Write-Host "📊 压缩包大小：$([math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB"
            echo "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV
          } else {
            Write-Error "❌ 压缩包生成失败！"
            exit 1
          }

      # 步骤9：上传target目录下所有JAR包
      - name: Upload all JAR files
        uses: actions/upload-artifact@v4
        with:
          name: 项目JAR包
          path: |
            ${{ github.workspace }}/target/*.jar
            ${{ github.workspace }}/target/**/*.jar
          retention-days: 90
          if-no-files-found: warn

      # 步骤10：上传SpigotPluginCreaterTool.zip压缩包
      - name: Upload SpigotPluginCreaterTool.zip
        uses: actions/upload-artifact@v4
        with:
          name: SpigotPluginCreaterTool完整包
          path: ${{ env.ZIP_PATH }}
          retention-days: 90
          if-no-files-found: error

      # 可选：打印最终目录结构（调试）
      - name: Show final target directory
        shell: pwsh
        run: |
          Write-Host "📂 target目录最终内容："
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE/target" -Recurse | Format-Table Name, FullName, Length