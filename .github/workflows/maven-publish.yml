name: Windows + JDK21 + JavaFX jlink (Auto Zip)

on:
  workflow_dispatch: # 手动触发
  # push:
  #   branches: [ main ]

jobs:
  javafx-jlink-build:
    runs-on: windows-latest
    steps:
      # 步骤1：检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：配置JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 步骤3：验证基础环境
      - name: Verify Env (JDK/Maven)
        run: |
          java -version
          mvn -v

      # 步骤4：执行Maven package（编译项目）
      - name: Maven Clean Package
        run: mvn clean package -DskipTests=true

      # 步骤5：执行JavaFX jlink（自动生成image目录 + app.zip）
      - name: Run JavaFX jlink (Auto Zip)
        run: |
          mvn javafx:jlink -DskipTests=true
          # 验证自动生成的zip文件
          Get-ChildItem -Path "target/*.zip" # 列出target下的zip包
          Write-Host "JLink auto-generated zip: $(Get-Item target/*.zip | Select-Object -ExpandProperty Name)"

      # 步骤6：上传插件自动生成的app.zip
      - name: Upload Auto-Generated app.zip
        uses: actions/upload-artifact@v4
        with:
          name: javafx-jlink-app
          path: target/*.zip # 直接匹配插件生成的zip包
          retention-days: 30