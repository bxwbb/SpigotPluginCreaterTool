name: 构建+重命名BAT+压缩上传

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # 步骤1：检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 步骤2：配置JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'

      # 步骤3：执行mvn package
      - name: Run mvn package
        id: run-package
        shell: pwsh
        run: |
          $env:MAVEN_OPTS = "-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8"
          echo "MAVEN_OPTS=$env:MAVEN_OPTS" >> $env:GITHUB_ENV
          
          Write-Host "📦 执行 mvn clean package -DskipTests=true"
          mvn clean package -DskipTests=true
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ mvn package 执行失败！"
            exit 1
          }
          Write-Host "✅ mvn package 执行成功"

      # 步骤4：执行javafx:jlink
      - name: Run javafx:jlink
        id: run-jlink
        shell: pwsh
        run: |
          Write-Host "🔗 执行 mvn javafx:jlink -DskipTests=true"
          mvn javafx:jlink -DskipTests=true
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ javafx:jlink 执行失败！"
            exit 1
          }
          Write-Host "✅ javafx:jlink 执行成功"

      # 步骤5：将app.bat重命名为start.bat
      - name: Rename app.bat to start.bat
        shell: pwsh
        run: |
          # 定义路径
          $oldBatPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/app/bin/app.bat"
          $newBatPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/app/bin/start.bat"

          # 检查原文件是否存在
          if (-not (Test-Path -Path $oldBatPath)) {
            Write-Error "❌ 未找到app.bat文件：$oldBatPath"
            # 打印目录结构辅助调试
            Write-Host "📂 target/app/bin 目录内容："
            Get-ChildItem -Path (Split-Path $oldBatPath) -Recurse | Format-Table Name, FullName
            exit 1
          }

          # 重命名文件（覆盖已有start.bat）
          Write-Host "🔄 重命名：$oldBatPath → $newBatPath"
          Rename-Item -Path $oldBatPath -NewName (Split-Path $newBatPath -Leaf) -Force -ErrorAction Stop
          
          # 验证重命名结果
          if (Test-Path -Path $newBatPath) {
            Write-Host "✅ 重命名成功，新文件路径：$newBatPath"
          } else {
            Write-Error "❌ 重命名失败！"
            exit 1
          }

      # 步骤6：删除target/app.zip文件
      - name: Delete app.zip
        shell: pwsh
        run: |
          $appZipPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/app.zip"
          
          if (Test-Path -Path $appZipPath) {
            Write-Host "🗑️ 删除文件：$appZipPath"
            Remove-Item -Path $appZipPath -Force -ErrorAction Stop
            Write-Host "✅ app.zip 删除成功"
          } else {
            Write-Host "ℹ️ 未找到app.zip文件，无需删除"
          }

      # 步骤7：压缩target/app目录为SpigotPluginCreaterTool.zip
      - name: Compress app directory to ZIP
        id: compress-app
        shell: pwsh
        run: |
          $appDir = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/app"
          $zipPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/SpigotPluginCreaterTool.zip"

          # 检查app目录是否存在
          if (-not (Test-Path -Path $appDir)) {
            Write-Error "❌ 未找到app目录：$appDir"
            exit 1
          }

          # 压缩目录（覆盖已有文件）
          Write-Host "📦 压缩目录：$appDir → $zipPath"
          Compress-Archive -Path "$appDir/*" -DestinationPath $zipPath -Force -CompressionLevel Optimal

          # 验证压缩包
          if (Test-Path -Path $zipPath) {
            Write-Host "✅ 压缩包生成成功！"
            Write-Host "📊 压缩包大小：$([math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB"
            echo "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV
          } else {
            Write-Error "❌ 压缩包生成失败！"
            exit 1
          }

      # 步骤8：上传所有JAR包
      - name: Upload all JAR files
        uses: actions/upload-artifact@v4
        with:
          name: SpigotPluginCreaterTool.jar
          path: |
            ${{ github.workspace }}/target/*.jar
            ${{ github.workspace }}/target/**/*.jar
          retention-days: 90
          if-no-files-found: warn

      # 步骤9：上传最终压缩包（含start.bat）
      - name: Upload SpigotPluginCreaterTool.zip
        uses: actions/upload-artifact@v4
        with:
          name: SpigotPluginCreaterTool.zip
          path: ${{ env.ZIP_PATH }}
          retention-days: 90
          if-no-files-found: error

      # 调试：打印最终目录结构
      - name: Show final target directory
        shell: pwsh
        run: |
          Write-Host "📂 target目录最终内容："
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE/target" -Recurse | Format-Table Name, FullName, Length, LastWriteTime