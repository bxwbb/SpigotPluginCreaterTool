name: Windows + JDK21 + BAT转EXE + 生成安装包

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exe-and-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'

      - name: Build & Generate app.zip
        id: build-jlink
        shell: pwsh
        run: |
          $env:MAVEN_OPTS = "-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8"
          echo "MAVEN_OPTS=$env:MAVEN_OPTS" >> $env:GITHUB_ENV
          
          Write-Host "📦 执行Maven clean package..."
          mvn clean package -DskipTests=true
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Maven package 构建失败！"
            exit 1
          }
          
          Write-Host "🔗 执行JavaFX jlink生成自定义JRE..."
          mvn javafx:jlink -DskipTests=true
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Maven javafx:jlink 执行失败！"
            exit 1
          }
          
          $zipPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/app.zip"
          if (-not (Test-Path $zipPath)) {
            $zipPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/image.zip"
            if (-not (Test-Path $zipPath)) {
              Write-Error "❌ 未找到app.zip/image.zip！构建产物缺失"
              Write-Host "📂 Target目录完整内容："
              Get-ChildItem -Path "target" -Recurse | Format-Table Name, FullName, Length
              exit 1
            }
            Write-Warning "⚠️ 找到image.zip，自动重命名为app.zip"
            Copy-Item -Path $zipPath -Destination "target/app.zip" -Force
            $zipPath = "target/app.zip"
          }
          Write-Host "✅ app.zip 生成成功：$zipPath"
          Get-Item $zipPath | Format-List Name, Length, LastWriteTime

      - name: Unzip app.zip & Find Launch Script
        id: unzip-app
        shell: pwsh
        run: |
          $appDir = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/app"
          
          if (Test-Path $appDir) {
            Remove-Item -Path $appDir -Recurse -Force -ErrorAction Stop
            Write-Host "ℹ️ 清理旧的app目录完成"
          }
          
          New-Item -Path $appDir -ItemType Directory -Force | Out-Null
          Expand-Archive -Path "target/app.zip" -DestinationPath $appDir -Force -ErrorAction Stop
          Write-Host "✅ app.zip 解压完成，目标目录：$appDir"
          
          Write-Host "📂 app目录完整结构："
          Get-ChildItem -Path $appDir -Recurse | Format-Table Name, FullName, Length, Extension
          
          $launchScripts = Get-ChildItem -Path $appDir -Recurse `
            -Include *.bat, *.cmd `
            -ErrorAction SilentlyContinue | Where-Object {
              $_.Name -match "app|Spigot|start|launch" -or $_.Directory.Name -eq "bin"
            }
          
          if ($launchScripts.Count -eq 0) {
            Write-Error "❌ 未找到任何启动脚本（BAT/CMD）！"
            exit 1
          }
          
          $launchScript = $launchScripts[0]
          echo "ORIGINAL_SCRIPT_PATH=$($launchScript.FullName)" >> $env:GITHUB_ENV
          echo "APP_BIN_DIR=$($launchScript.Directory.FullName)" >> $env:GITHUB_ENV
          Write-Host "✅ 找到启动脚本：$($launchScript.FullName)"
          Write-Host "📄 脚本类型：$($launchScript.Extension)"

      # ======================== 修复下载问题：改用curl + 关闭进度条 ========================
      - name: Download BAT to EXE Converter (Portable)
        id: download-bat2exe
        shell: pwsh
        run: |
          # 关键修复1：关闭PowerShell进度条（大幅提升下载稳定性）
          $ProgressPreference = 'SilentlyContinue'
          
          # 关键修复2：改用curl下载（替代Invoke-WebRequest）
          $toolDir = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "tools/bat2exe"
          $zipFile = Join-Path -Path $toolDir -ChildPath "bat2exe-converter.zip"
          # 备用地址（优先使用GitHub镜像，避免SourceForge访问问题）
          $bat2exeUrls = @(
            "https://mirror.ghproxy.com/https://downloads.sourceforge.net/project/bat-to-exe-converter/bat2exe-converter.zip",
            "https://downloads.sourceforge.net/project/bat-to-exe-converter/bat2exe-converter.zip"
          )
          
          # 创建工具目录
          if (-not (Test-Path $toolDir)) {
            New-Item -Path $toolDir -ItemType Directory -Force | Out-Null
          }
          
          # 循环重试下载（多地址容错）
          $downloadSuccess = $false
          foreach ($url in $bat2exeUrls) {
            try {
              Write-Host "📥 尝试下载：$url"
              # 使用curl下载（Windows内置，更稳定）
              curl -L -o "$zipFile" "$url" --connect-timeout 30 --max-time 300
          
              # 验证下载文件
              if (Test-Path $zipFile -and (Get-Item $zipFile).Length -gt 0) {
                $downloadSuccess = $true
                Write-Host "✅ 下载成功：$zipFile"
                break
              } else {
                Write-Warning "⚠️ 下载文件为空，尝试下一个地址"
                if (Test-Path $zipFile) { Remove-Item $zipFile -Force }
              }
            } catch {
              Write-Warning "⚠️ 下载失败：$_，尝试下一个地址"
              if (Test-Path $zipFile) { Remove-Item $zipFile -Force }
            }
          }
          
          # 检查下载结果
          if (-not $downloadSuccess) {
            Write-Error "❌ 所有地址下载BAT to EXE Converter失败！"
            exit 1
          }
          
          # 解压工具
          Expand-Archive -Path $zipFile -DestinationPath $toolDir -Force
          
          # 查找bat2exe.exe
          $bat2exeExe = Get-ChildItem -Path $toolDir -Recurse -Name "bat2exe.exe" | Select-Object -First 1
          if ([string]::IsNullOrEmpty($bat2exeExe)) {
            Write-Error "❌ 未找到bat2exe.exe！解压后的工具目录："
            Get-ChildItem -Path $toolDir -Recurse | Format-Table Name, FullName
            exit 1
          }
          
          $bat2exePath = Join-Path -Path $toolDir -ChildPath $bat2exeExe
          echo "BAT2EXE_PATH=$bat2exePath" >> $env:GITHUB_ENV
          Write-Host "✅ BAT to EXE Converter准备完成：$bat2exePath"

      - name: Convert Launch Script to EXE
        id: convert-script
        shell: pwsh
        run: |
          $exeName = "我的世界spigot开发工具.exe"
          $exePath = Join-Path -Path $env:APP_BIN_DIR -ChildPath $exeName
          $developer = "BXWBB"
          $productName = "我的世界spigot开发工具"

          Write-Host "🔄 转换启动脚本为EXE：$($env:ORIGINAL_SCRIPT_PATH) → $exePath"
          & "$env:BAT2EXE_PATH" `
            --bat "$env:ORIGINAL_SCRIPT_PATH" `
            --exe "$exePath" `
            --author "$developer" `
            --product "$productName" `
            --description "Spigot插件开发辅助工具（基于JDK21+JavaFX）" `
            --noconsole `
            --unicode `
            --admin 0 `
            --icon none

          if (Test-Path $exePath) {
            echo "APP_EXE_NAME=$exeName" >> $env:GITHUB_ENV
            echo "APP_NAME=$productName" >> $env:GITHUB_ENV
            Write-Host "✅ 脚本转EXE成功！"
            Get-Item $exePath | Format-List Name, Length, FullName, CreationTime
          } else {
            Write-Error "❌ BAT转EXE失败！"
            Get-ChildItem -Path $env:APP_BIN_DIR -Recurse | Format-Table Name, FullName, Length
            exit 1
          }

      - name: Get Project Version
        id: get-version
        shell: pwsh
        run: |
          $env:MAVEN_OPTS = "-Dfile.encoding=UTF-8"
          try {
            $version = mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>&1
            if ($version -match "^\d+\.\d+\.\d+(-\w+)?$" -and -not $version.Contains("ERROR")) {
              Write-Host "✅ 从POM读取版本号成功：$version"
            } else {
              throw "版本号格式无效：$version"
            }
          } catch {
            $version = "1.0.0"
            Write-Warning "⚠️ 读取POM版本失败，使用兜底版本：$version"
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "📌 最终使用版本号：$version"

      - name: Build Installer with jpackage
        id: build-installer
        shell: pwsh
        run: |
          if (-not (Get-Command "jpackage" -ErrorAction SilentlyContinue)) {
            Write-Error "❌ jpackage命令未找到！请确认JDK21配置正确"
            java -version
            exit 1
          }
          Write-Host "ℹ️ jpackage版本：$(jpackage --version)"

          $appName = $env:APP_NAME
          $appVersion = $env:VERSION
          $appVendor = "BXWBB"
          $inputDir = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target/app/image"
          $outputDir = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "target"
          $exeName = "$appName_v$appVersion-安装包.exe"

          $jarFiles = Get-ChildItem -Path $inputDir -Recurse -Include *.jar | Where-Object {
            -not $_.Name.Contains("javafx") -and -not $_.Name.Contains("module") -and -not $_.Name.Contains("jdk")
          }
          if ($jarFiles.Count -eq 0) {
            Write-Error "❌ 未找到应用核心JAR包！"
            exit 1
          }
          $mainJar = $jarFiles[0].Name
          $mainJarPath = $jarFiles[0].DirectoryName
          Write-Host "ℹ️ 找到应用JAR包：$mainJar（路径：$mainJarPath）"
          
          $manifestPath = "jar:$($jarFiles[0].FullName)!META-INF/MANIFEST.MF"
          try {
            $mainClass = (Get-Content -Path $manifestPath -ErrorAction Stop | Select-String -Pattern "Main-Class: " | ForEach-Object {
              $_.Line -replace "Main-Class: ", ""
            }).Trim()
            if ([string]::IsNullOrEmpty($mainClass)) {
              throw "Main-Class字段为空"
            }
            Write-Host "ℹ️ 从MANIFEST.MF读取主类：$mainClass"
          } catch {
            $mainClass = "org.bxwbb.SpigotPluginCreaterToolMain" # 替换为你的实际主类
            Write-Warning "⚠️ 读取Main-Class失败，使用兜底主类：$mainClass"
          }

          Write-Host "🚀 开始生成Windows安装包..."
          jpackage `
            --type exe `
            --name "$appName" `
            --version "$appVersion" `
            --input "$mainJarPath" `
            --dest "$outputDir" `
            --vendor "$appVendor" `
            --win-exe-name "$exeName" `
            --win-shortcut `
            --win-dir-chooser `
            --win-menu `
            --win-menu-group "$appName" `
            --win-uninstall-display-name "$appName" `
            --verbose `
            --icon none `
            --main-jar "$mainJar" `
            --main-class "$mainClass"

          $installerFile = Get-ChildItem -Path "$outputDir/$exeName" -ErrorAction SilentlyContinue
          if (-not $installerFile) {
            Write-Error "❌ 安装包生成失败！"
            Write-Host "📂 Output目录内容："
            Get-ChildItem -Path "$outputDir" -Recurse | Format-Table Name, FullName, Length
            exit 1
          }

          echo "INSTALLER_PATH=$($installerFile.FullName)" >> $env:GITHUB_ENV
          Write-Host "✅ 安装包生成成功！"
          Write-Host "📦 安装包路径：$($installerFile.FullName)"
          Write-Host "📊 安装包大小：$([math]::Round($installerFile.Length / 1MB, 2)) MB"

      - name: Upload Standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: 我的世界spigot开发工具-独立EXE
          path: ${{ env.APP_BIN_DIR }}/${{ env.APP_EXE_NAME }}
          retention-days: 90
          if-no-files-found: error

      - name: Upload Installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_v${{ env.VERSION }}-安装包
          path: ${{ env.INSTALLER_PATH }}
          retention-days: 90
          if-no-files-found: error

      - name: Upload Raw app Directory
        uses: actions/upload-artifact@v4
        with:
          name: 原始app目录（含EXE+JRE）
          path: target/app
          retention-days: 30
          if-no-files-found: error